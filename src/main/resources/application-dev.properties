# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/pigeon-devis
spring.datasource.username=pigeon-devis
spring.datasource.password=PigeonDevis2024!SecureDB

# JPA/Hibernate for development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging for development
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG

# Server error handling for development
server.error.include-stacktrace=always
server.error.include-exception=true

# Dev Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Actuator for development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.roles=admin
management.endpoint.health.password=admin

# CORS for development (à ajuster selon votre frontend)
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# JWT Configuration
app.jwt.secret=votre_secret_jwt_super_securise_a_changer_en_production
app.jwt.expiration=86400000 